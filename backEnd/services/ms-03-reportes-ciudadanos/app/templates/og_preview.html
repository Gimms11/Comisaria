<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Comisaría La Tinguiña</title>
    
    <!-- OpenGraph Meta Tags para WhatsApp, Facebook, Telegram -->
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Comisaría Sectorial PNP La Tinguiña" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:image" content="{{ image_url }}" />
    <meta property="og:url" content="{{ page_url }}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="{{ image_url }}">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; border-radius: 16px; max-width: 500px; width: 100%; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 9999px; background: #0284c7; color: white; font-size: 12px; font-weight: bold; text-transform: uppercase; margin-bottom: 12px; }
        h1 { font-size: 20px; margin: 0 0 8px 0; color: #38bdf8; }
        p { color: #cbd5e1; font-size: 15px; line-height: 1.5; margin: 0 0 16px 0; }
        .img-preview { width: 100%; border-radius: 12px; max-height: 300px; object-fit: cover; margin-bottom: 16px; }
        .footer { font-size: 13px; color: #94a3b8; border-top: 1px solid #334155; padding-top: 12px; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">{{ category_name }}</span>
        <h1>Incidencia Urbana: {{ public_code }}</h1>
        <p>{{ description }}</p>
        {% if image_url %}
        <img class="img-preview" src="{{ image_url }}" alt="Evidencia de reporte">
        {% endif %}
        <div class="footer">
            <span>Estado: <strong>{{ status }}</strong></span>
            <span>Comisaría La Tinguiña</span>
        </div>
    </div>
</body>
</html>
